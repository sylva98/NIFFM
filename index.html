<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>电台排错页</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; padding-top: 40px; }
        .player-box { max-width: 420px; margin: auto; background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }
        h3 { margin-top: 0; color: #b3b3b3; font-size: 14px; }
        #status-msg { font-size: 16px; margin: 20px 0; color: #ff5555; word-break: break-all; }
        audio { width: 100%; margin-top: 15px; outline: none; }
    </style>
</head>
<body>

<div class="player-box">
    <h3 id="playlist-name">正在初始化...</h3>
    <div id="status-msg">准备连接</div>
    <audio id="audio-player" controls playsinline></audio>
</div>

<script>
    const repoOwner = "sylva98";
    const repoName = "NIFFM";

    const audioPlayer = document.getElementById('audio-player');
    const statusMsg = document.getElementById('status-msg');
    const nameElement = document.getElementById('playlist-name');

    async function init() {
        try {
            nameElement.innerText = "正在读取 rock.json 歌单...";
            let jsonUrl = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/rock.json`;
            
            let res = await fetch(jsonUrl);
            if (!res.ok) throw new Error("无法获取 rock.json 文件 (HTTP " + res.status + ")");
            
            let playlist = await res.json();
            if (!Array.isArray(playlist) || playlist.length === 0) throw new Error("rock.json 内容为空");

            nameElement.innerText = `歌单加载成功 (共 ${playlist.length} 首)`;
            
            let song = playlist[0];
            statusMsg.style.color = "#1db954";
            statusMsg.innerText = "正在加载第一首歌: " + (song.name || song.title);

            // 加上代理测试
            let proxyUrl = "https://corsproxy.io/?";
            audioPlayer.src = proxyUrl + encodeURIComponent(song.url);

            // 监听音频加载状态
            audioPlayer.oncanplay = () => {
                statusMsg.style.color = "#1db954";
                statusMsg.innerText = "就绪: " + (song.name || song.title);
            };

            audioPlayer.onerror = () => {
                statusMsg.style.color = "#ff5555";
                statusMsg.innerText = "音频加载失败！代理服务器无法读取该阿里云外链或链接已失效。";
            };

        } catch (err) {
            statusMsg.style.color = "#ff5555";
            statusMsg.innerText = "发生错误: " + err.message;
        }
    }

    init();
</script>

</body>
</html>
