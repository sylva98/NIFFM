<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的专属在线电台</title>
    <style>
        body { 
            background: #121212; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            padding-top: 50px; 
        }
        .player-box { 
            max-width: 420px; 
            margin: auto; 
            background: #1e1e1e; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.6); 
        }
        h3 { margin-top: 0; color: #b3b3b3; font-size: 14px; }
        #song-title { 
            font-size: 18px; 
            margin: 20px 0; 
            color: #1db954; 
            font-weight: bold;
            word-break: break-all;
        }
        audio { width: 100%; margin-top: 15px; outline: none; }
    </style>
</head>
<body>

<div class="player-box">
    <h3 id="playlist-name">正在加载电台歌单...</h3>
    <div id="song-title">初始化中</div>
    <audio id="audio-player" controls playsinline></audio>
</div>

<script>
    const repoOwner = "sylva98";
    const repoName = "NIFFM";

    const audioPlayer = document.getElementById('audio-player');
    const titleElement = document.getElementById('song-title');
    const nameElement = document.getElementById('playlist-name');

    async function initPlayer() {
        try {
            // 直接读取你 GitHub 仓库里的 rock.json 歌单
            let jsonUrl = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/rock.json`;
            let playlistRes = await fetch(jsonUrl);
            let playlist = await playlistRes.json();

            if (!Array.isArray(playlist) || playlist.length === 0) {
                titleElement.innerText = "歌单数据为空";
                return;
            }

            nameElement.innerText = `当前电台: rock.json (共 ${playlist.length} 首)`;

            // 随机洗牌
            for (let i = playlist.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [playlist[i], playlist[j]] = [playlist[j], playlist[i]];
            }

            let currentIndex = 0;

            function loadCurrentSong() {
                if (currentIndex >= playlist.length) {
                    playlist.sort(() => Math.random() - 0.5);
                    currentIndex = 0;
                }
                const song = playlist[currentIndex];
                
                // 使用公开稳定的 CORS 代理通道中转阿里云 OSS 音频，彻底避开跨域和证书拦截
                const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(song.url);
                
                audioPlayer.src = proxyUrl;
                titleElement.innerText = `${song.name || song.title || '未知歌曲'}`;
            }

            // 自动连播下一首
            audioPlayer.onended = function() {
                currentIndex++;
                loadCurrentSong();
                audioPlayer.play().catch(e => {
                    console.log("等待用户交互后继续连播");
                });
            };

            loadCurrentSong();

        } catch (error) {
            console.error("加载失败:", error);
            titleElement.innerText = "歌单加载失败，请检查";
        }
    }

    initPlayer();
</script>

</body>
</html>
