<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>电台动态随机音乐播放器</title>
    <style>
        body { 
            background: #121212; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            padding-top: 40px; 
        }
        .player-box { 
            max-width: 420px; 
            margin: auto; 
            background: #1e1e1e; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.6); 
        }
        h3 { margin-top: 0; color: #b3b3b3; font-size: 14px; }
        #song-title { 
            font-size: 18px; 
            margin: 20px 0; 
            color: #1db954; 
            font-weight: bold;
            word-break: break-all;
        }
        audio { width: 100%; margin-top: 15px; outline: none; }
    </style>
</head>
<body>

<div class="player-box">
    <h3 id="playlist-name">正在连接电台歌单...</h3>
    <div id="song-title">初始化中...</div>
    <audio id="audio-player" controls autoplay></audio>
</div>

<script>
    // 配置你的 GitHub 仓库信息
    const repoOwner = "sylva98";
    const repoName = "NIFFM";

    const audioPlayer = document.getElementById('audio-player');
    const titleElement = document.getElementById('song-title');
    const nameElement = document.getElementById('playlist-name');

    async function initPlayer() {
        try {
            // 1. 获取 URL 中的参数，看指定了哪个 JSON 文件（例如 ?file=rock.json）
            const urlParams = new URLSearchParams(window.location.search);
            let targetFile = urlParams.get('file');

            // 如果没有指定具体文件，通过 GitHub API 自动抓取仓库里所有的 json 文件
            if (!targetFile) {
                let res = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/`);
                let files = await res.json();
                
                // 筛选出所有 .json 文件（你可以把不需要的配置文件排除在外，比如 stations.json）
                let jsonFiles = files.filter(f => f.name.endsWith('.json') && f.name !== 'stations.json');
                
                if (jsonFiles.length === 0) {
                    titleElement.innerText = "仓库中未找到任何 JSON 歌单";
                    return;
                }
                // 如果没传参数，随机选一个
                targetFile = jsonFiles[Math.floor(Math.random() * jsonFiles.length)].name;
            }

            nameElement.innerText = `当前播放歌单: ${targetFile}`;

            // 2. 加载对应的 JSON 歌单内容
            let jsonUrl = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/${targetFile}`;
            let playlistRes = await fetch(jsonUrl);
            let playlist = await playlistRes.json();

            if (!Array.isArray(playlist) || playlist.length === 0) {
                titleElement.innerText = "歌单数据为空或格式不正确";
                return;
            }

            // 3. 【核心】每次页面加载（即电台每次点击链接）时，对歌单进行随机洗牌（Fisher-Yates 随机打乱）
            for (let i = playlist.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [playlist[i], playlist[j]] = [playlist[j], playlist[i]];
            }

            let currentIndex = 0;

            // 4. 播放控制函数
            function playCurrentSong() {
                if (currentIndex >= playlist.length) {
                    // 播完整轮后再次打乱，实现无限随机循环
                    playlist.sort(() => Math.random() - 0.5);
                    currentIndex = 0;
                }
                const song = playlist[currentIndex];
                audioPlayer.src = song.url;
                titleElement.innerText = `正在播放: ${song.name || song.title}`;
                
                // 尝试自动播放
                audioPlayer.play().catch(error => {
                    console.log("浏览器拦截了自动播放，需用户手动点击:", error);
                    titleElement.innerText += " (请点击播放按钮)";
                });
            }

            // 监听当前歌曲结束事件，自动切下一首
            audioPlayer.onended = function() {
                currentIndex++;
                playCurrentSong();
            };

            // 开始播放第一首
            playCurrentSong();

        } catch (error) {
            console.error("加载失败:", error);
            titleElement.innerText = "歌单加载失败，请检查网络或文件名";
        }
    }

    initPlayer();
</script>

</body>
</html>
