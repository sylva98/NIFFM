<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的专属随机电台</title>
    <style>
        body { 
            background: #121212; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            padding-top: 50px; 
        }
        .player-box { 
            max-width: 420px; 
            margin: auto; 
            background: #1e1e1e; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.6); 
        }
        h3 { margin-top: 0; color: #b3b3b3; font-size: 14px; }
        #song-title { 
            font-size: 18px; 
            margin: 20px 0; 
            color: #1db954; 
            font-weight: bold;
            word-break: break-all;
        }
        audio { width: 100%; margin-top: 15px; outline: none; }
    </style>
</head>
<body>

<div class="player-box">
    <h3 id="playlist-name">正在连接电台...</h3>
    <div id="song-title">加载中...</div>
    <!-- 加上 playsinline 保证移动端和桌面端兼容 -->
    <audio id="audio-player" controls playsinline></audio>
</div>

<script>
    const repoOwner = "sylva98";
    const repoName = "NIFFM";

    // 🔴【请在这里填入你的 Cloudflare Worker 专属链接】
    // 例如: "https://my-radio-proxy.yourname.workers.dev/?url="
    const cloudflareProxy = "https://ancient-block-9bfd.838375625.workers.dev/?url=";

    const audioPlayer = document.getElementById('audio-player');
    const titleElement = document.getElementById('song-title');
    const nameElement = document.getElementById('playlist-name');

    async function initPlayer() {
        try {
            // 读取你仓库里的 rock.json
            let jsonUrl = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/rock.json`;
            nameElement.innerText = "正在读取 rock.json 歌单...";
            
            let playlistRes = await fetch(jsonUrl);
            let playlist = await playlistRes.json();

            if (!Array.isArray(playlist) || playlist.length === 0) {
                titleElement.innerText = "歌单数据为空";
                return;
            }

            nameElement.innerText = `当前电台: rock.json (共 ${playlist.length} 首)`;

            // 每次打开网页时进行随机洗牌
            for (let i = playlist.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [playlist[i], playlist[j]] = [playlist[j], playlist[i]];
            }

            let currentIndex = 0;

            function loadCurrentSong() {
                if (currentIndex >= playlist.length) {
                    // 列表播完一轮后，重新洗牌并无缝循环
                    playlist.sort(() => Math.random() - 0.5);
                    currentIndex = 0;
                }
                const song = playlist[currentIndex];
                
                // 通过你的 Cloudflare 专属代理加载阿里云外链音频
                audioPlayer.src = cloudflareProxy + encodeURIComponent(song.url);
                titleElement.innerText = `${song.name || song.title || '未知歌曲'}`;
            }

            // 监听当前歌曲播放结束，自动切下一首并连播
            audioPlayer.onended = function() {
                currentIndex++;
                loadCurrentSong();
                audioPlayer.play().catch(e => {
                    console.log("浏览器限制了自动连播，请点击播放按钮继续", e);
                });
            };

            // 初始化加载第一首
            loadCurrentSong();

        } catch (error) {
            console.error("加载失败:", error);
            titleElement.innerText = "歌单加载失败，请检查网络";
        }
    }

    initPlayer();
</script>

</body>
</html>
